# Nginx configuration for clean URLs
server {
    listen 80;
    server_name makspilot.com www.makspilot.com;
    
    # Custom 404 error pages for different languages
    error_page 404 @notfound;
    
    # Redirect index.html to root
    location ~ ^(.*)/index\.html$ {
        return 301 $1/;
    }
    
    # Redirect www to non-www
    if ($host = www.makspilot.com) {
        return 301 https://makspilot.com$request_uri;
    }
    
    # Handle language-specific 404 pages
    location @notfound {
        # Check if request is for a language directory
        if ($uri ~ ^/(ru|pl|zh|es|pt|ja|de|fr)/) {
            rewrite ^/(ru|pl|zh|es|pt|ja|de|fr)/.*$ /$1/404.html last;
        }
        # Default to English 404
        rewrite ^.*$ /404.html last;
    }
    
    # Handle language directories
    location ~ ^/(ru|pl|zh|es|pt|ja|de|fr)/ {
        try_files $uri $uri/ $uri.html $uri/index.html @notfound;
    }
    
    # Try files without extension for root
    location / {
        try_files $uri $uri/ $uri.html @notfound;
    }
}
